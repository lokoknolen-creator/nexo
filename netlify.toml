# Netlify konfiqurasiyası — DP frontend
# Bu fayl repo kökündə yerləşir və Netlify deploy üçün nəzərdə tutulub.

[build]
  publish = "."

# Bütün səhifələr üçün sadə qaydalar
[[redirects]]
  from = "/*"
  to = "/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
